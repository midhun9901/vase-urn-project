<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="650" viewBox="0 0 1200 650" role="img" aria-labelledby="title desc">
  <title id="title">Vase retrieval results by method</title>
  <desc id="desc">Horizontal bars compare mean average precision and Accuracy at 1 for six valid retrieval experiments. DINOv2 with Triplet Loss performs best at 83.39 percent mAP and 80.77 percent Accuracy at 1.</desc>
  <style>
    text { font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
    .title { fill: #f6fbff; font-size: 30px; font-weight: 700; letter-spacing: -0.5px; }
    .subtitle { fill: #8fa5b4; font-size: 15px; }
    .label { fill: #dce8ee; font-size: 15px; font-weight: 600; }
    .axis { fill: #6f8796; font-size: 13px; }
    .value { fill: #c8d8e1; font-size: 12px; font-weight: 600; }
    .best { fill: #65ead4; }
    .legend { fill: #9eb2bf; font-size: 13px; }
  </style>
  <rect width="1200" height="650" rx="20" fill="#071721"/>
  <text class="title" x="42" y="54">Held-out retrieval performance</text>
  <text class="subtitle" x="42" y="82">Valid runs · shared vase-folder split · seed 42</text>

  <rect x="824" y="43" width="15" height="15" rx="3" fill="#50d6c2"/>
  <text class="legend" x="848" y="56">mAP</text>
  <rect x="909" y="43" width="15" height="15" rx="3" fill="#607b90"/>
  <text class="legend" x="933" y="56">Accuracy@1</text>

  <g stroke="#17313e" stroke-width="1">
    <line x1="330" y1="122" x2="330" y2="584"/>
    <line x1="517.5" y1="122" x2="517.5" y2="584"/>
    <line x1="705" y1="122" x2="705" y2="584"/>
    <line x1="892.5" y1="122" x2="892.5" y2="584"/>
    <line x1="1080" y1="122" x2="1080" y2="584"/>
  </g>
  <g class="axis" text-anchor="middle">
    <text x="330" y="111">0</text>
    <text x="517.5" y="111">25</text>
    <text x="705" y="111">50</text>
    <text x="892.5" y="111">75</text>
    <text x="1080" y="111">100%</text>
  </g>

  <rect x="22" y="424" width="1138" height="78" rx="12" fill="#0d2932" stroke="#1c514f"/>

  <g>
    <text class="label" x="42" y="157">Raw ResNet50</text>
    <rect x="330" y="140" width="750" height="14" rx="7" fill="#102a36"/>
    <rect x="330" y="140" width="116.33" height="14" rx="7" fill="#50d6c2"/>
    <text class="value" x="456" y="152">15.51</text>
    <rect x="330" y="164" width="750" height="14" rx="7" fill="#102a36"/>
    <rect x="330" y="164" width="115.35" height="14" rx="7" fill="#607b90"/>
    <text class="value" x="455" y="176">15.38</text>
  </g>

  <g>
    <text class="label" x="42" y="227">ResNet50 + Triplet</text>
    <rect x="330" y="210" width="750" height="14" rx="7" fill="#102a36"/>
    <rect x="330" y="210" width="410.93" height="14" rx="7" fill="#50d6c2"/>
    <text class="value" x="751" y="222">54.79</text>
    <rect x="330" y="234" width="750" height="14" rx="7" fill="#102a36"/>
    <rect x="330" y="234" width="331.73" height="14" rx="7" fill="#607b90"/>
    <text class="value" x="672" y="246">44.23</text>
  </g>

  <g>
    <text class="label" x="42" y="297">ResNet50 + ProxyAnchor</text>
    <rect x="330" y="280" width="750" height="14" rx="7" fill="#102a36"/>
    <rect x="330" y="280" width="430.73" height="14" rx="7" fill="#50d6c2"/>
    <text class="value" x="771" y="292">57.43</text>
    <rect x="330" y="304" width="750" height="14" rx="7" fill="#102a36"/>
    <rect x="330" y="304" width="331.73" height="14" rx="7" fill="#607b90"/>
    <text class="value" x="672" y="316">44.23</text>
  </g>

  <g>
    <text class="label" x="42" y="367">Raw DINOv2</text>
    <rect x="330" y="350" width="750" height="14" rx="7" fill="#102a36"/>
    <rect x="330" y="350" width="243.98" height="14" rx="7" fill="#50d6c2"/>
    <text class="value" x="584" y="362">32.53</text>
    <rect x="330" y="374" width="750" height="14" rx="7" fill="#102a36"/>
    <rect x="330" y="374" width="201.90" height="14" rx="7" fill="#607b90"/>
    <text class="value" x="542" y="386">26.92</text>
  </g>

  <g>
    <text class="label best" x="42" y="447">DINOv2 + Triplet</text>
    <text class="axis" x="42" y="469">BEST MODEL</text>
    <rect x="330" y="434" width="750" height="14" rx="7" fill="#12353c"/>
    <rect x="330" y="434" width="625.43" height="14" rx="7" fill="#65ead4"/>
    <text class="value best" x="966" y="446">83.39</text>
    <rect x="330" y="458" width="750" height="14" rx="7" fill="#12353c"/>
    <rect x="330" y="458" width="605.78" height="14" rx="7" fill="#7f9bb0"/>
    <text class="value best" x="946" y="470">80.77</text>
  </g>

  <g>
    <text class="label" x="42" y="537">Pose + Triplet</text>
    <rect x="330" y="520" width="750" height="14" rx="7" fill="#102a36"/>
    <rect x="330" y="520" width="341.63" height="14" rx="7" fill="#50d6c2"/>
    <text class="value" x="682" y="532">45.55</text>
    <rect x="330" y="544" width="750" height="14" rx="7" fill="#102a36"/>
    <rect x="330" y="544" width="288.45" height="14" rx="7" fill="#607b90"/>
    <text class="value" x="628" y="556">38.46</text>
  </g>

  <line x1="42" y1="603" x2="1158" y2="603" stroke="#17313e"/>
  <text class="subtitle" x="42" y="629">Task-specific metric learning adds 50.86 mAP points over raw DINOv2 features.</text>
</svg>
